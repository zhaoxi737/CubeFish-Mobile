name: CubeFish Mobile CI

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 引擎里有两个模块用 Java 8 工具链编译（MioLibPatcher / jre_lwjgl3glfw）
      - name: Set up JDK 8 (Gradle toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --channel=3 \
            "platforms;android-37.0" "build-tools;37.0.0" \
            "ndk;27.3.13750724" "ndk;28.2.13676358" > /dev/null
        shell: bash

      - name: Get JRE8 (upstream CI artifact)
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Get bundled JRE17/21 (internal runtime layout)
        run: |
          set -e
          build_one() {
            folder="$1"; tag="$2"; name="$3"; ver="$4"
            dest="app_pojavlauncher/src/main/assets/components/$folder"
            mkdir -p "$dest"
            curl -L --retry 3 -o "$dest/bin-arm64.tar.xz" \
              "https://github.com/AngelAuraMC/angelauramc-openjdk-build/releases/download/$tag/$name"
            tar -cJf "$dest/universal.tar.xz" --files-from /dev/null
            printf '%s' "$ver" > "$dest/version"
          }
          build_one jre-new download_jre17 jre17-android-arm64.tar.xz cubefish-jre17-arm64-1
          build_one jre-21 download_jre21 jre21-android-arm64.tar.xz cubefish-jre21-arm64-1

      - name: Languagelist        run: |
          chmod +x scripts/languagelist_updater.sh
          bash scripts/languagelist_updater.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Build debug APK
        run: gradle :app_pojavlauncher:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cubefish-mobile-debug
          path: app_pojavlauncher/build/outputs/apk/debug/*.apk
